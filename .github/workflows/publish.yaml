name: publish

on:
  push:
    tags:
      - "v*"
      - "prebuild-test.*"

jobs:
  prebuild:
    name: Prebuild for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library_name: crsqlite.so
            artifact_name: crsqlite.zip
            asset_name: crsqlite-linux-x86_64.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Load .env file
        uses: xom9ikk/dotenv@v2
        with:
          path: ./

      - name: Build
        run: |
          cd core
          make loadable
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  # we can probably collapse all these into the prebuild job
  prebuild-macos-x86_64:
    name: Prebuild for macos x86_64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            library_name: crsqlite.dylib
            artifact_name: crsqlite.zip
            asset_name: crsqlite-darwin-x86_64.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add x86_64-apple-darwin --toolchain nightly-2023-10-05

      # macos-latest runners are arm64, so the target has to be explicit or the
      # build silently produces an arm64 dylib under an x86_64 name.
      - name: Build MacOS x86_64 dylib
        run: |
          cd core
          export CI_MAYBE_TARGET="x86_64-apple-darwin" && make loadable
          lipo -info dist/${{ matrix.library_name }}
          lipo -info dist/${{ matrix.library_name }} | grep -q 'x86_64'
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload macos dylib to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  prebuild-macos-arm:
    name: Prebuild for macos arm
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            library_name: crsqlite.dylib
            artifact_name: crsqlite.zip
            asset_name: crsqlite-darwin-aarch64.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add aarch64-apple-darwin --toolchain nightly-2023-10-05

      - name: Build MacOS Arm dylib
        run: |
          cd core
          export CI_MAYBE_TARGET="aarch64-apple-darwin" && make loadable
          lipo -info dist/${{ matrix.library_name }}
          lipo -info dist/${{ matrix.library_name }} | grep -q 'arm64'
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload macos dylib to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

      - name: Build all ios dynamic
        run: |
          cd core
          ./all-ios-loadable.sh

      - name: Upload framework to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/crsqlite-ios-dylib.xcframework.tar.gz
          asset_name: crsqlite-ios-dylib.xcframework.tar.gz
          tag: ${{ github.ref }}

  prebuild-linux-arm:
    name: Prebuild for linux arm
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            library_name: crsqlite.so
            artifact_name: crsqlite.zip
            asset_name: crsqlite-linux-aarch64.zip

    steps:
      - name: Install toolchain
        run: |
          sudo apt update && sudo apt install -y gcc make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2023-10-05
          rustup component add rust-src --toolchain nightly-2023-10-05-x86_64-unknown-linux-gnu

      - name: Build
        run: |
          cd core
          export CI_MAYBE_TARGET="aarch64-unknown-linux-gnu" && export CI_GCC="aarch64-linux-gnu-gcc" && make loadable
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  prebuild-windows-x86_64:
    name: Prebuild for Windows x86_64
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            library_name: crsqlite.dll
            artifact_name: crsqlite.zip
            asset_name: crsqlite-win-x86_64.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add x86_64-pc-windows-gnu --toolchain nightly-2023-10-05
          rustup component add rust-src --toolchain nightly-2023-10-05-x86_64-unknown-linux-gnu

      - name: mingw-w64
        run: |
          sudo apt update && sudo apt install -y mingw-w64

      - name: Build
        run: |
          cd core
          export CI_MAYBE_TARGET="x86_64-pc-windows-gnu" && export CI_GCC="x86_64-w64-mingw32-gcc" && make loadable
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  prebuild-windows-arm64:
    name: Prebuild for Windows arm64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add aarch64-pc-windows-msvc --toolchain nightly-2023-10-05

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build
        shell: bash
        run: |
          cd core
          export CI_MAYBE_TARGET="aarch64-pc-windows-msvc" && export CI_GCC="clang" && make loadable
          cd dist && 7z a crsqlite.zip crsqlite.dll

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/crsqlite.zip
          asset_name: crsqlite-win-aarch64.zip
          tag: ${{ github.ref }}

  prebuild-windows-i686:
    name: Prebuild for Windows i686
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            library_name: crsqlite.dll
            artifact_name: crsqlite.zip
            asset_name: crsqlite-win-i686.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add i686-pc-windows-gnu --toolchain nightly-2023-10-05
          rustup component add rust-src --toolchain nightly-2023-10-05-x86_64-unknown-linux-gnu

      - name: mingw-w64
        run: |
          sudo apt update && sudo apt install -y mingw-w64

      - name: Build
        run: |
          cd core
          export CI_MAYBE_TARGET="i686-pc-windows-gnu" && export CI_GCC="i686-w64-mingw32-gcc" && make loadable
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

  prebuild-android:
    name: Prebuild for android ${{ matrix.rust_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: aarch64-linux-android
            library_name: crsqlite.so
            artifact_name: crsqlite.zip
            asset_name: crsqlite-aarch64-linux-android.zip
          - os: ubuntu-latest
            rust_target: armv7-linux-androideabi
            library_name: crsqlite.so
            artifact_name: crsqlite.zip
            asset_name: crsqlite-armv7-linux-androideabi.zip
          - os: ubuntu-latest
            rust_target: x86_64-linux-android
            library_name: crsqlite.so
            artifact_name: crsqlite.zip
            asset_name: crsqlite-x86_64-linux-android.zip

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rust Nightly
        run: |
          rustup toolchain install nightly-2023-10-05
          rustup target add ${{ matrix.rust_target }} --toolchain nightly-2023-10-05
          rustup component add rust-src --toolchain nightly-2023-10-05-x86_64-unknown-linux-gnu

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          local-cache: true
          add-to-path: false

      - name: Cargo NDK
        run: cargo install cargo-ndk

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd core
          export ANDROID_TARGET=${{ matrix.rust_target }}; make SHARED_CFLAGS="-Wl,-z,max-page-size=16384" loadable
          cd dist; zip crsqlite.zip ${{ matrix.library_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: core/dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
